services:
  app:
    build:
      context: .
      args:
        GIT_REVISION: ${GIT_REVISION:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5173
      STORAGE_DRIVER: sqlite
      DATA_DIR: /app/data
      TRUST_PROXY: "true"
    volumes:
      - linguashelf-data:/app/data
      - linguashelf-backups:/app/backups
    expose:
      - "5173"
    networks:
      edge-gateway:
        aliases:
          - app

networks:
  edge-gateway:
    external: true
    name: edge-gateway

volumes:
  linguashelf-data:
  linguashelf-backups:
